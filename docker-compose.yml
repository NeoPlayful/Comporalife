services:
  postgres:
    image: postgres:16-alpine
    container_name: comporalife-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comporalife}
      POSTGRES_USER: ${POSTGRES_USER:-comporalife}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comporalife}
      TZ: UTC
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-comporalife} -d ${POSTGRES_DB:-comporalife}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: comporalife-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: comporalife-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-comporalife}:${POSTGRES_PASSWORD:-comporalife}@postgres:5432/${POSTGRES_DB:-comporalife}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须设置}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-CNY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_PRETTY: 'false'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/api/system/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - internal

  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comporalife-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '3000:80'
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - internal

volumes:
  postgres-data:
  redis-data:

networks:
  internal:
    driver: bridge
