<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Comporalife 复利人生</title>
    <script>
      // 首屏上色。必须同步执行且在样式表之前，否则浅色用户会先看到一帧深色。
      // 判定逻辑与 src/theme/theme.ts 保持一致：读 cl-ui 里的 theme 字段，
      // "system" 时跟随系统，读不到则默认深色。
      (function () {
        var theme = 'dark';
        try {
          var raw = localStorage.getItem('cl-ui');
          if (raw) {
            var state = JSON.parse(raw).state;
            if (state && typeof state.theme === 'string') theme = state.theme;
          }
        } catch (e) {
          /* 存储不可用时保持默认 */
        }
        var dark =
          theme === 'dark' ||
          (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        if (dark) root.classList.add('dark');
        root.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
